        function getWeekStatus(dateStr) {
            // dateStr format: "01.10.2026"
            const [day, month, year] = dateStr.split('.').map(Number);
            const weekDate = new Date(year, month - 1, day);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const daysAgo = Math.floor((today - weekDate) / (1000 * 60 * 60 * 24));
            
            if (daysAgo < 0) {
                return 'future'; // Zukünftig
            } else if (daysAgo <= 28) { // 4 Wochen
                return 'recent'; // Kürzlich (Normal oder Grau)
            } else {
                return 'old'; // Alt (Ausblenden)
            }
        }

                        }
                    });
                });
            });
            
            // 100% Spieler
            const html100 = fullPlayers
                .filter(name => stats[name])
                .sort((a, b) => (stats[b].confirmed / stats[b].total || 0) - (stats[a].confirmed / stats[a].total || 0))
                .map(name => {
                    const data = stats[name];
                    const percent = data.total > 0 ? Math.round((data.confirmed / data.total) * 100) : 0;
                    let barColor = '#10b981'; // Grün >= 66%
                    if (percent < 33) barColor = '#ef4444'; // Rot < 33%
                    else if (percent < 66) barColor = '#eab308'; // Gelb 33-66%
                    
                    return `<div class="stat-item">
                        <div class="stat-name">${name} (100%)</div>
                        <div class="stat-ratio">${data.confirmed}/${data.total} (${percent}%)</div>
                        <div class="stat-bar-container">
                            <div class="stat-bar" style="width: ${percent}%; background-color: ${barColor};"></div>
                        </div>
                    </div>`;
                }).join('');
            
            // 50% Spieler
            const html50 = partialPlayers
                .filter(name => stats[name])
                .sort((a, b) => (stats[b].confirmed / stats[b].total || 0) - (stats[a].confirmed / stats[a].total || 0))
                .map(name => {
                    const data = stats[name];
                    const percent = data.total > 0 ? Math.round((data.confirmed / data.total) * 100) : 0;
                    let barColor = '#10b981'; // Grün >= 50%
                    if (percent < 25) barColor = '#ef4444'; // Rot < 25%
                    else if (percent < 50) barColor = '#eab308'; // Gelb 25-50%
                    
                    return `<div class="stat-item">
                        <div class="stat-name">${name} (50%)</div>
                        <div class="stat-ratio">${data.confirmed}/${data.total} (${percent}%)</div>
                        <div class="stat-bar-container">
                            <div class="stat-bar" style="width: ${Math.min(percent, 100)}%; background-color: ${barColor};"></div>
                        </div>
                    </div>`;
                }).join('');
            
            document.getElementById('stats100Container').innerHTML = html100 || '<p style="color:#999;">Keine Daten</p>';
            document.getElementById('stats50Container').innerHTML = html50 || '<p style="color:#999;">Keine Daten</p>';
        }
        
        function updateNextWeek() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            let nextWeek = null;
            MONTH_ORDER.forEach(month => {
                const weeks = currentData[month];
                if (!weeks) return;
                weeks.forEach(week => {
                    const [day, month, year] = week.monday.split('.').map(Number);
                    const weekDate = new Date(year, month - 1, day);
                    if (weekDate >= today && !nextWeek) {
                        nextWeek = week;
                    }
                });
            });
            
            if (nextWeek) {
                const confirmedPlayers = Object.entries(nextWeek.availabilities)
                    .filter(([_, status]) => status === '🟡')
                    .map(([name, _]) => name);
                if (nextWeek.additionalPlayerStatus === '🟡' && nextWeek.additionalPlayer) {
                    confirmedPlayers.push(nextWeek.additionalPlayer);
                }
                const confirmCount = confirmedPlayers.length;
                const gameType = confirmCount >= 4 ? 'Doppel' : confirmCount >= 2 ? 'Einzel' : '−';
                const playerList = confirmedPlayers.length > 0 ? ` (${confirmedPlayers.join(', ')})` : '';
                document.getElementById('nextWeekText').innerHTML = 
                    `📅 Nächste Woche: <strong>${nextWeek.monday}</strong> (${nextWeek.kw}) • ${confirmCount}/6+ bestätigt${playerList} → <strong>${gameType}</strong>`;
            } else {
                document.getElementById('nextWeekText').innerHTML = '✅ Saison beendet!';
            }
        }
        
        function printNextWeek() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            let nextWeek = null;
            MONTH_ORDER.forEach(month => {
                const weeks = currentData[month];
                if (!weeks) return;
                weeks.forEach(week => {
                    const [day, month, year] = week.monday.split('.').map(Number);
                    const weekDate = new Date(year, month - 1, day);
                    if (weekDate >= today && !nextWeek) {
                        nextWeek = week;
                    }
                });
            });
            
            if (!nextWeek) {
                alert('Keine kommende Woche gefunden');
                return;
            }
            
            const confirmedPlayers = Object.entries(nextWeek.availabilities)
                .filter(([_, status]) => status === '🟡')
                .map(([name, _]) => name);
            if (nextWeek.additionalPlayerStatus === '🟡' && nextWeek.additionalPlayer) {
                confirmedPlayers.push(nextWeek.additionalPlayer);
            }
            const confirmCount = confirmedPlayers.length;
            const gameType = confirmCount >= 4 ? 'Doppel' : confirmCount >= 2 ? 'Einzel' : '−';
            const playerList = confirmedPlayers.length > 0 ? `, ${confirmedPlayers.join(', ')}` : '';
            
            const playerRows = Object.entries(nextWeek.availabilities)
                .map(([name, status]) => `<tr>
                    <td style="padding: 8px; border-bottom: 1px solid #ddd;">${name}</td>
                    <td style="padding: 8px; border-bottom: 1px solid #ddd; text-align: center; font-size: 18px;">${status}</td>
                </tr>`).join('');
            
            const printWindow = window.open('', '', 'width=600,height=800');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Montagsrunde - ${nextWeek.kw}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; background: white; }
                        h1 { color: #0369a1; margin-bottom: 10px; }
                        .info { background: #e0f2fe; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
                        .info-line { margin: 8px 0; font-size: 16px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th { background: #0ea5e9; color: white; padding: 10px; text-align: left; }
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>
                    <h1>🟡 Montagsrunde Tennisplanung</h1>
                    <div class="info">
                        <div class="info-line"><strong>Woche:</strong> ${nextWeek.kw}</div>
                        <div class="info-line"><strong>Datum:</strong> ${nextWeek.monday}</div>
                        <div class="info-line"><strong>Bestätigt:</strong> ${confirmCount} Spieler${playerList}</div>
                        <div class="info-line"><strong>Spieltyp:</strong> <strong>${gameType}</strong></div>
                        ${nextWeek.remarks ? `<div class="info-line"><strong>Bemerkung:</strong> ${nextWeek.remarks}</div>` : ''}
                    </div>
                    <table>
                        <thead><tr><th>Spieler</th><th>Status</th></tr></thead>
                        <tbody>
                            ${playerRows}
                        </tbody>
                    </table>
                    <p style="margin-top: 30px; color: #999; font-size: 12px;">Druckdatum: ${new Date().toLocaleDateString('de-DE')}</p>
                </body>
                </html>
            `);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 250);
        }
        
        function renderAll() {
            renderLogs();
            renderMonths();
            calculateStats();
            updateNextWeek();
            
            setTimeout(() => {
                document.querySelectorAll('.remarks-field input').forEach(input => {
                    updateScrollAnimation(input);
                });
            }, 0);
        }

        function renderLogs() {
            const html = logs.map(log => {
                const date = new Date(log.timestamp);
                const time = date.toLocaleString('de-DE', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                return `<div class="log-entry">
                    <div class="log-time">${time}</div>
                    <div><span class="log-player">${log.player}</span> ${log.month} ${log.week}: ${log.oldStatus} → ${log.newStatus}</div>
                </div>`;
            }).join('');
            
            document.getElementById('changelog').innerHTML = html || '<p style="color:#999;">Noch keine Änderungen</p>';
        }

        function renderMonths() {
            if (!currentData) return;
            let html = '';
            
            MONTH_ORDER.forEach(month => {
                const weeks = currentData[month];
                if (!weeks) return;
                
                html += `<div class="month-section">
                    <div class="month-title">${month}</div>
                    <div class="weeks-grid">`;
                
                weeks.forEach((week, idx) => {
                    let confirmCount = Object.values(week.availabilities).filter(v => v === '🟡').length;
                    
                    // Zusätzlicher Spieler auch zählen
                    if (week.additionalPlayerStatus === '🟡') {
                        confirmCount++;
                    }
                    
                    const gameType = confirmCount >= 4 ? 'Doppel' : confirmCount >= 2 ? 'Einzel' : '−';
                    
                    // Woche-Status prüfen (Datum parsing: DD.MM.YYYY → YYYY-MM-DD)
                    const dateObj = new Date(week.monday.split('.').reverse().join('-'));
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const daysAgo = Math.floor((today - dateObj) / (1000 * 60 * 60 * 24));
                    
                    let weekClasses = 'week-card';
                    if (daysAgo > 28) {
                        weekClasses += ' hidden'; // älter als 4 Wochen: ausblenden
                    } else if (daysAgo >= 0) {
                        weekClasses += ' expired'; // 0-28 Tage alt: grau
                    }
                    
                    html += `<div class="${weekClasses}">
                        <div class="week-header">
                            <div class="week-kw">${week.kw}</div>
                            <div class="week-date">${week.monday}</div>
                        </div>
                        <div class="remarks-field">
                            <input type="text" 
                                placeholder="Bemerkung..." 
                                value="${week.remarks || ''}"
                                maxlength="60"
                                onchange="saveRemarks('${month}', ${idx}, this.value)"
                                oninput="updateScrollAnimation(this)">
                        </div>`;
                    
                    Object.keys(PLAYERS).forEach(player => {
                        const status = week.availabilities[player];
                        const isConfirm = status === '🟡';
                        html += `<div class="player-row">
                            <div class="player-name">${player}</div>
                            <button class="status-btn ${isConfirm ? 'confirm' : 'unavailable'}" 
                                onclick="toggle('${month}', ${idx}, '${player}')">
                                ${status}
                            </button>
                        </div>`;
                    });
                    
                    const additionalName = week.additionalPlayer || '';
                    const additionalStatus = week.additionalPlayerStatus || '❌';
                    const additionalIsConfirm = additionalStatus === '🟡';
                    html += `<div class="player-row additional-row">
                        <input type="text" class="additional-player-name"
                            placeholder="+" 
                            maxlength="10"
                            value="${additionalName}"
                            onchange="saveAdditionalPlayer('${month}', ${idx}, this.value)">
                        <button class="status-btn ${additionalIsConfirm ? 'confirm' : 'unavailable'}" 
                            onclick="toggleAdditional('${month}', ${idx})">
                            ${additionalStatus}
                        </button>
                    </div>`;
                    
                    html += `<div class="game-type">${gameType}</div></div>`;
                });
                
                html += `</div></div>`;
            });
            
            document.getElementById('monthsContainer').innerHTML = html;
        }

        function toggleChangelog() {
            const list = document.getElementById('changelog');
            const btn = document.getElementById('toggleBtn');
            changelogOpen = !changelogOpen;
            
            if (changelogOpen) {
                list.classList.add('open');
                btn.textContent = 'Zuklappen';
            } else {
                list.classList.remove('open');
                btn.textContent = 'Öffnen';
            }
        }

        async function toggle(month, weekIdx, player) {
            const states = ['❌', '🟡'];
            const current = currentData[month][weekIdx].availabilities[player];
            const nextIdx = (states.indexOf(current) + 1) % states.length;
            const newStatus = states[nextIdx];
            
            logs.unshift({
                timestamp: new Date().toISOString(),
                player: player,
                month: month,
                week: currentData[month][weekIdx].kw,
                oldStatus: current,
                newStatus: newStatus
            });
            
            currentData.logs = logs;
            currentData[month][weekIdx].availabilities[player] = newStatus;
            renderAll();
            
            try {
                const rowId = window.currentRowId || 1;
                const { error } = await supabaseClient
                    .from('tennis_data')
                    .update({ 
                        data: currentData,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', rowId);
                
                if (error) {
                    console.error('Error:', error);
                    document.getElementById('syncStatus').textContent = 'FEHLER: ' + error.message;
                }
            } catch (error) {
                console.error('Exception:', error);
            }
        }

        async function saveRemarks(month, weekIdx, remark) {
            currentData[month][weekIdx].remarks = remark;
            
            try {
                const rowId = window.currentRowId || 1;
                const { error } = await supabaseClient
                    .from('tennis_data')
                    .update({ 
                        data: currentData,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', rowId);
                
                if (error) console.error('Save error:', error);
            } catch (error) {
                console.error('Exception:', error);
            }
        }

        async function saveAdditionalPlayer(month, weekIdx, name) {
            const oldName = currentData[month][weekIdx].additionalPlayer || '';
            currentData[month][weekIdx].additionalPlayer = name;
            
            // Logging nur wenn sich etwas geändert hat
            if (oldName !== name) {
                logs.unshift({
                    timestamp: new Date().toISOString(),
                    player: name || '(gelöscht)',
                    month: month,
                    week: currentData[month][weekIdx].kw,
                    oldStatus: oldName || '−',
                    newStatus: name || '−'
                });
                currentData.logs = logs;
            }
            
            renderAll();
            
            try {
                const rowId = window.currentRowId || 1;
                const { error } = await supabaseClient
                    .from('tennis_data')
                    .update({ 
                        data: currentData,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', rowId);
                
                if (error) console.error('Save error:', error);
            } catch (error) {
                console.error('Exception:', error);
            }
        }

        async function toggleAdditional(month, weekIdx) {
            const additionalName = currentData[month][weekIdx].additionalPlayer || '(ohne Name)';
            const status = currentData[month][weekIdx].additionalPlayerStatus || '❌';
            const newStatus = status === '❌' ? '🟡' : '❌';
            
            logs.unshift({
                timestamp: new Date().toISOString(),
                player: additionalName,
                month: month,
                week: currentData[month][weekIdx].kw,
                oldStatus: status,
                newStatus: newStatus
            });
            
            currentData.logs = logs;
            currentData[month][weekIdx].additionalPlayerStatus = newStatus;
            renderAll();
            
            try {
                const rowId = window.currentRowId || 1;
                const { error } = await supabaseClient
                    .from('tennis_data')
                    .update({ 
                        data: currentData,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', rowId);
                
                if (error) console.error('Toggle error:', error);
            } catch (error) {
                console.error('Exception:', error);
            }
        }

        loadData();
    </script>
</body>
</html>
