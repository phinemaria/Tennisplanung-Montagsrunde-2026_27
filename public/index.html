<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montagsrunde Tennisplanung 2026/27</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; border: 1px solid rgba(51, 65, 85, 0.1); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); }
        .header { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; padding: 25px 30px; text-align: center; }
        .header h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .sync-status { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 12px; font-size: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
        .status-dot.synced { background: #10b981; animation: none; }
        .status-dot.syncing { background: #f59e0b; }
        .status-dot.error { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .content { padding: 16px 12px; }
        .months-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        @media (max-width: 900px) { .months-container { grid-template-columns: 1fr; } }
        .month-title { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
        .weeks-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
        .week-card { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .week-card:hover { transform: translateY(-1px); border-color: #cbd5e1; }
        .week-kw { font-size: 13px; font-weight: 700; color: #64748b; }
        .week-date-monday { font-size: 14px; font-weight: 800; color: #0ea5e9; margin-top: 3px; }
        .player-row { display: grid; grid-template-columns: 28px 1fr; gap: 6px; align-items: center; margin-bottom: 4px; }
        .player-name { font-size: 13px; font-weight: 700; color: #1e293b; }
        .availability-btn { width: 100%; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 18px; background: white; padding: 6px 0; height: 32px; }
        .availability-btn.confirm { color: #16a34a; background: #dcfce7; border-color: #86efac; }
        .availability-btn.unavailable { color: #dc2626; background: #fee2e2; border-color: #fca5a5; }
        .availability-btn:hover { transform: scale(1.05); }
        .game-type { margin-top: 8px; padding: 6px; border-radius: 4px; font-size: 12px; font-weight: 700; text-align: center; background: #f1f5f9; color: #64748b; }
        .footer { text-align: center; padding: 20px; color: #64748b; font-size: 13px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
        .error-message { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px 15px; border-radius: 6px; margin: 15px 30px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const PLAYERS = { AB: "Axel", RP: "Robert", DG: "Dirk", UW: "Ulrich", DR: "Dietmar" };
        const API_URL = '/api/tennis';
        
        function TennisPlanner() {
            const [data, setData] = useState(null);
            const [syncStatus, setSyncStatus] = useState('loading');
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                try {
                    setSyncStatus('syncing');
                    const response = await fetch(`${API_URL}?action=load`);
                    const json = await response.json();
                    setData(json);
                    setSyncStatus('synced');
                } catch (error) {
                    setSyncStatus('error');
                    setErrorMsg(`Fehler: ${error.message}`);
                }
            };

            const saveData = async (newData) => {
                try {
                    setSyncStatus('syncing');
                    const response = await fetch(`${API_URL}?action=save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newData)
                    });
                    setSyncStatus('synced');
                } catch (error) {
                    setSyncStatus('error');
                    setErrorMsg(`Fehler: ${error.message}`);
                }
            };

            const toggleAvailability = (month, weekIdx, player) => {
                if (!data) return;
                const states = ["❌", "🟡"];
                const current = data[month][weekIdx].availabilities[player];
                const nextIdx = (states.indexOf(current) + 1) % states.length;

                const newData = {
                    ...data,
                    [month]: data[month].map((week, idx) =>
                        idx === weekIdx
                            ? { ...week, availabilities: { ...week.availabilities, [player]: states[nextIdx] } }
                            : week
                    )
                };
                setData(newData);
                saveData(newData);
            };

            const calculateGameType = (availabilities) => {
                const count = Object.values(availabilities).filter(v => v === "🟡").length;
                return count >= 4 ? "Doppel" : count >= 2 ? "Einzel" : "";
            };

            if (!data) {
                return <div className="container"><div className="header"><h1>🟡 Tennisplanung</h1><p>Lädt...</p></div></div>;
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>🟡 Montagsrunde Tennisplanung</h1>
                        <p>Saison 2026/2027 • Live Sync</p>
                        <div className="sync-status">
                            <div className={`status-dot ${syncStatus}`}></div>
                            <span>{syncStatus === 'syncing' && 'Synchronisiert...'} {syncStatus === 'synced' && 'Synchronisiert ✓'} {syncStatus === 'error' && 'Fehler'}</span>
                        </div>
                    </div>
                    {errorMsg && <div className="error-message">{errorMsg}</div>}
                    <div className="content">
                        <div className="months-container">
                            {Object.entries(data).map(([month, weeks]) => (
                                <div key={month}>
                                    <div className="month-title">{month}</div>
                                    <div className="weeks-grid">
                                        {weeks.map((week, idx) => (
                                            <div key={idx} className="week-card">
                                                <div><div className="week-kw">{week.kw}</div><div className="week-date-monday">{week.monday}</div></div>
                                                <div>
                                                    {Object.keys(PLAYERS).map(player => (
                                                        <div key={player} className="player-row">
                                                            <div className="player-name">{player}</div>
                                                            <button className={`availability-btn ${week.availabilities[player] === '🟡' ? 'confirm' : 'unavailable'}`} onClick={() => toggleAvailability(month, idx, player)}>
                                                                {week.availabilities[player]}
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="game-type">{calculateGameType(week.availabilities) || '−'}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="footer">💾 Daten werden live synchronisiert</div>
                </div>
            );
        }
        ReactDOM.render(<TennisPlanner />, document.getElementById('root'));
    </script>
</body>
</html>
