<!DOCTYPE html>
<html lang="de">
<head>

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(51, 65, 85, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
            position: relative;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            font-size: 12px;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.synced {
            background: #10b981;
            animation: none;
        }

        .status-dot.syncing {
            background: #f59e0b;
        }

        .status-dot.error {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .token-setup {
            padding: 40px 30px;
            text-align: center;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            margin: 30px;
            border-radius: 12px;
        }

        .token-setup h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .token-setup p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .token-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .token-input-group input {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            min-width: 250px;
        }

        .token-input-group button {
            padding: 10px 25px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .token-input-group button:hover {
            background: #2563eb;
        }

        .token-note {
            font-size: 12px;
            color: #64748b;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .content {
            padding: 16px 12px;
        }

        .months-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .months-container {
                grid-template-columns: 1fr;
            }

        .month-section {

        }

        .player-grid {

            margin-bottom: 6px;
        }

        .player-row {
            display: grid;

            border-radius: 4px;
            border: 1px solid;
            display: flex;
            align-items: center;

            color: #64748b;

            color: #166534;
            padding: 12px 15px;
            border-radius: 6px;
            margin: 15px 30px;

        }

        @media (max-width: 768px) {
            .weeks-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

                { kw: "KW 17", weekRange: "26.04.2027 - 02.05.2027", monday: "Montag, 26.04.2027", availabilities: { AB: "❌", RP: "❌", DG: "❌", UW: "❌", DR: "🟡" } },
            ]

        const PLAYERS = {
            AB: "Axel Borchers",
            RP: "Robert Papendick",
            DG: "Dirk Grothmann",
            UW: "Ulrich Wegener",
            DR: "Dietmar Reule"
        };

        function TennisPlanner() {
            const [token, setToken] = useState(() => localStorage.getItem('githubToken') || '');
            const [data, setData] = useState(INITIAL_DATA);
            const [syncStatus, setSyncStatus] = useState('idle'); // idle, syncing, synced, error
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const tokenInputRef = useRef(null);

            // Laden beim Start
            useEffect(() => {
                if (token) {
                    loadFromGitHub();
                }
            }, []);

            // Auto-save nach Änderungen
            useEffect(() => {
                if (token && syncStatus !== 'syncing') {
                    const timer = setTimeout(() => {
                        saveToGitHub();
                    }, 1000);
                    return () => clearTimeout(timer);
                }
            }, [data, token]);

            const base64Encode = (str) => btoa(unescape(encodeURIComponent(str)));
            const base64Decode = (str) => decodeURIComponent(escape(atob(str)));

            const loadFromGitHub = async () => {
                if (!token) return;
                setSyncStatus('syncing');
                setErrorMsg('');

                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`,
                        {
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );

                    if (response.ok) {
                        const content = await response.json();
                        const decodedData = JSON.parse(base64Decode(content.content));
                        setData(decodedData);
                        setSyncStatus('synced');
                        setSuccessMsg('Daten von GitHub geladen');
                        setTimeout(() => setSuccessMsg(''), 3000);
                    } else if (response.status === 404) {
                        // Datei existiert nicht, also initial speichern
                        await saveToGitHub();
                    } else {
                        throw new Error(`GitHub Error: ${response.status}`);
                    }
                } catch (error) {
                    setSyncStatus('error');
                    setErrorMsg(`Fehler beim Laden: ${error.message}`);
                }
            };

            const saveToGitHub = async () => {
                if (!token) return;
                setSyncStatus('syncing');

                try {
                    // Erst prüfen, ob Datei existiert (für SHA)
                    let sha = null;
                    const getResponse = await fetch(
                        `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`,
                        {
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );

                    if (getResponse.ok) {
                        const content = await getResponse.json();
                        sha = content.sha;
                    } else if (getResponse.status !== 404) {
                        // Fehler außer 404 (Datei nicht gefunden)
                        const errText = await getResponse.text();
                        console.error('GET Response:', getResponse.status, errText);
                    }

                    // Datei speichern/aktualisieren
                    const dataString = JSON.stringify(data, null, 2);
                    const encodedData = base64Encode(dataString);

                    const putBody = {
                        message: `Update tennis data - ${new Date().toLocaleString('de-DE')}`,
                        content: encodedData
                    };

                    if (sha) {
                        putBody.sha = sha;
                    }

                    const putResponse = await fetch(
                        `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(putBody)
                        }
                    );

                    if (putResponse.ok) {
                        setSyncStatus('synced');
                    } else {
                        const errData = await putResponse.json();
                        let errorDetail = '';
                        if (putResponse.status === 401) {
                            errorDetail = 'Authentifizierung fehlgeschlagen - Token ungültig?';
                        } else if (putResponse.status === 403) {
                            errorDetail = 'Keine Schreibberechtigung - Token Scope "repo" erforderlich';
                        } else if (errData.message) {
                            errorDetail = errData.message;
                        }
                        throw new Error(`GitHub Error ${putResponse.status}: ${errorDetail}`);
                    }
                } catch (error) {
                    setSyncStatus('error');
                    setErrorMsg(`Fehler beim Speichern: ${error.message}`);
                    console.error('Save error:', error);
                }
            };

            const handleTokenSubmit = async () => {
                const inputToken = tokenInputRef.current?.value?.trim();
                if (!inputToken) {
                    setErrorMsg('Token darf nicht leer sein');
                    return;
                }

                if (!inputToken.startsWith('ghp_')) {
                    setErrorMsg('Token muss mit "ghp_" beginnen');
                    return;
                }

                // Token validieren
                setSyncStatus('syncing');
                setErrorMsg('');
                
                try {
                    const response = await fetch('https://api.github.com/user', {
                        headers: {
                            'Authorization': `token ${inputToken}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (response.status === 401) {
                        setErrorMsg('Token ungültig! Bitte überprüfe ihn auf https://github.com/settings/tokens');
                        setSyncStatus('error');
                        return;
                    }

                    if (response.status === 403) {
                        setErrorMsg('Token hat nicht die richtige Berechtigung (Scope "repo" erforderlich)');
                        setSyncStatus('error');
                        return;
                    }

                    if (!response.ok) {
                        setErrorMsg(`Token-Validierung fehlgeschlagen: ${response.status}`);
                        setSyncStatus('error');
                        return;
                    }

                    localStorage.setItem('githubToken', inputToken);
                    setToken(inputToken);
                    setSuccessMsg('Token gespeichert und validiert! ✓');
                    setTimeout(() => {
                        loadFromGitHub();
                    }, 500);
                } catch (error) {
                    setErrorMsg(`Netzwerkfehler beim Token-Check: ${error.message}`);
                    setSyncStatus('error');
                }
            };

            const handleTokenRemove = () => {
                localStorage.removeItem('githubToken');
                setToken('');
                setErrorMsg('');
            };

            const toggleAvailability = (month, weekIdx, player) => {
                const states = ["❌", "🟡"];
                const current = data[month][weekIdx].availabilities[player];
                const currentIdx = states.indexOf(current);
                const nextIdx = (currentIdx + 1) % states.length;
                const newValue = states[nextIdx];

                setData(prev => ({
                    ...prev,
                    [month]: prev[month].map((week, idx) =>
                        idx === weekIdx
                            ? {
                                ...week,
                                availabilities: {
                                    ...week.availabilities,
                                    [player]: newValue
                                }
                            }
                            : week
                    )
                }));

                setSyncStatus('syncing');
            };

            const calculateGameType = (availabilities) => {
                const confirmCount = Object.values(availabilities).filter(v => v === "🟡").length;
                if (confirmCount >= 4) return "Doppel";
                if (confirmCount >= 2) return "Einzel";
                return "";
            };

            if (!token) {
                return (
                    <div className="container">
                        <div className="header">
                            <h1>🟡 Montagsrunde Tennisplanung</h1>
                            <p>Cloud Sync Edition - GitHub Integration</p>
                        </div>
                        <div className="token-setup">
                            <h2>GitHub Token einrichten</h2>
                            <p>
                                Um Änderungen auf allen Geräten synchron zu halten, brauchst du einen GitHub Personal Access Token.<br/>
                                <strong>Der Token wird nur lokal in deinem Browser gespeichert.</strong>
                            </p>
                            <div className="token-input-group">
                                <input
                                    ref={tokenInputRef}
                                    type="password"
                                    placeholder="Gib dein GitHub Token ein (ghp_...)"
                                    onKeyPress={(e) => e.key === 'Enter' && handleTokenSubmit()}
                                />
                                <button onClick={handleTokenSubmit}>Token prüfen & speichern</button>
                            </div>
                            <div className="token-note">
                                <strong>Token noch nicht vorhanden?</strong><br/>
                                1. Gehe zu <a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a><br/>
                                2. Name: "Tennis Planner"<br/>
                                3. Scope: Hake ✅ "repo" an<br/>
                                4. Kopiere den Token und füge ihn hier ein
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>🟡 Montagsrunde Tennisplanung</h1>
                        <p>Saison 2026/2027 • Cloud Sync</p>
                        <div className="sync-status">
                            <div className={`status-dot ${syncStatus}`}></div>
                            <span>
                                {syncStatus === 'syncing' && 'Wird synchronisiert...'}
                                {syncStatus === 'synced' && 'Synchronisiert ✓'}
                                {syncStatus === 'error' && 'Fehler beim Sync'}
                                {syncStatus === 'idle' && 'Bereit'}
                            </span>
                            <button 
                                onClick={handleTokenRemove}
                                style={{
                                    marginLeft: '20px',
                                    padding: '4px 12px',
                                    fontSize: '12px',
                                    background: 'rgba(255,255,255,0.2)',
                                    border: '1px solid rgba(255,255,255,0.3)',
                                    color: 'white',
                                    borderRadius: '4px',
                                    cursor: 'pointer'
                                }}
                            >
                                Token wechseln
                            </button>
                        </div>
                    </div>

                    {errorMsg && <div className="error-message">{errorMsg}</div>}
                    {successMsg && <div className="success-message">{successMsg}</div>}

                    <div className="content">
                        <div className="legend">
                            <div className="legend-item">
                                <div className="legend-box" style={{ color: '#16a34a', borderColor: '#16a34a' }}>🟡</div>
                                <span className="legend-text">Bestätigt</span>
                            </div>
                            <div className="legend-item">
                                <div className="legend-box" style={{ color: '#dc2626', borderColor: '#dc2626' }}>❌</div>
                                <span className="legend-text">Nicht verfügbar</span>
                            </div>
                        </div>

                        <div className="months-container">
                            {Object.entries(data).map(([month, weeks]) => (
                                <div key={month} className="month-section">
                                    <div className="month-title">{month}</div>
                                    <div className="weeks-grid">
                                        {weeks.map((week, idx) => (
                                            <div key={idx} className="week-card">
                                                <div className="week-header">
                                                    <div>
                                                        <div className="week-kw">{week.kw}</div>
                                                        <div className="week-date-full">{week.weekRange}</div>
                                                        <div className="week-date-monday">{week.monday}</div>
                                                    </div>
                                                </div>
                                                
                                                <div className="player-grid">
                                                    {Object.keys(PLAYERS).map(player => (
                                                        <div key={player} className="player-row">
                                                            <div className="player-name">{player}</div>
                                                            <button
                                                                className={`availability-btn ${week.availabilities[player] === '🟡' ? 'confirm' : 'unavailable'}`}
                                                                onClick={() => toggleAvailability(month, idx, player)}
                                                                title={`${PLAYERS[player]} - ${week.monday}`}
                                                            >
                                                                {week.availabilities[player] || '−'}
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>

                                                <div className="game-type">
                                                    {calculateGameType(week.availabilities) || '−'}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="footer">
                        💾 Änderungen werden automatisch auf GitHub synchronisiert
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TennisPlanner />, document.getElementById('root'));
    </script>
</body>
</html>
